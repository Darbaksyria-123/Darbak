              ('مطاعم ومقاهي', grp('nwr(area.a)["amenity"~"^(restaurant|cafe|fast_food)$"](newer:"%s");', 1)),
              ('أفران وصرافة', grp('nwr(area.a)["shop"~"^(bakery|money_transfer)$"](newer:"%s");nwr(area.a)["amenity"~"^(bureau_de_change|money_transfer)$"](newer:"%s");', 2)),
              ('فنادق', grp('nwr(area.a)["tourism"~"^(hotel|guest_house|motel)$"](newer:"%s");', 1)),
          ]
